<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Zersoft Mark">
  <defs>
    <linearGradient id="cmG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cmG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cmG3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="120" height="120" rx="28" fill="#070c15"/>
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <g transform="translate(24, 20) scale(1.6)" filter="url(#glow)">
    <polygon points="0,5  3,11  44,33  44,31" fill="url(#cmG1)"/>
    <polygon points="0,29  0,35  44,33  44,31" fill="url(#cmG2)"/>
    <polygon points="0,53  3,59  44,33  44,31" fill="url(#cmG3)"/>
    <circle cx="44" cy="32" r="4" fill="#0ea5e9"/>
    <circle cx="44" cy="32" r="1.8" fill="#ffffff"/>
  </g>
</svg>
