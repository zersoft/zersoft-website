<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Zersoft Sosyal Medya Postu">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spBg" cx="20%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="40%" stop-color="#070c15"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="spGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(34,211,238,0.2)"/>
    </pattern>

    <!-- Stream Gradients -->
    <linearGradient id="spStr1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spStr2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spStr3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="spTitleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.5)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0.3)"/>
    </linearGradient>

    <filter id="spGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="url(#spBg)"/>
  <rect width="1080" height="1080" fill="url(#spGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="850" cy="250" r="300" fill="#0ea5e9" opacity="0.12" filter="blur(80px)"/>
  <circle cx="200" cy="800" r="350" fill="#6366f1" opacity="0.09" filter="blur(90px)"/>

  <!-- Top Header Bar with Zersoft Logo -->
  <g transform="translate(80, 80)">
    <!-- Convergence Mark -->
    <g transform="scale(1.2)">
      <polygon points="0,5  3,11  44,33  44,31" fill="url(#spStr1)"/>
      <polygon points="0,29  0,35  44,33  44,31" fill="url(#spStr2)"/>
      <polygon points="0,53  3,59  44,33  44,31" fill="url(#spStr3)"/>
      <circle cx="44" cy="32" r="3.2" fill="#0ea5e9"/>
      <circle cx="44" cy="32" r="1.3" fill="#ffffff"/>
    </g>
    <!-- Logo Text -->
    <g transform="translate(68, 0)">
      <text x="0" y="32" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="26" font-weight="800" letter-spacing="1.5">
        <tspan fill="#ffffff">ZER</tspan><tspan fill="#38bdf8">SOFT</tspan>
      </text>
      <text x="0" y="47" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.2" fill="#94a3b8">
        YENİ NESİL TEKNOLOJİ
      </text>
    </g>

    <!-- Top Right Category Badge -->
    <g transform="translate(740, 6)">
      <rect width="180" height="36" rx="18" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
      <text x="90" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">KURUMSAL DUYURU</text>
    </g>
  </g>

  <!-- Central Hero Card (Glassmorphism) -->
  <g transform="translate(80, 220)">
    <!-- Glass Box -->
    <rect width="920" height="640" rx="28" fill="#0b1322" fill-opacity="0.8" stroke="url(#glassBorder)" stroke-width="1.5"/>

    <!-- Decorative Top Line Accent -->
    <line x1="40" y1="0" x2="200" y2="0" stroke="#22d3ee" stroke-width="3"/>

    <!-- Large Convergence Emblem in background of card -->
    <g transform="translate(560, 110) scale(6)" opacity="0.18">
      <polygon points="0,5  3,11  44,33  44,31" fill="#22d3ee"/>
      <polygon points="0,29  0,35  44,33  44,31" fill="#0ea5e9"/>
      <polygon points="0,53  3,59  44,33  44,31" fill="#6366f1"/>
      <circle cx="44" cy="32" r="3.2" fill="#0ea5e9"/>
    </g>

    <!-- Content Inside Card -->
    <g transform="translate(60, 80)">
      <!-- Eyebrow Pill -->
      <g transform="translate(0, 0)">
        <rect width="190" height="32" rx="8" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.25)" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#22d3ee"/>
        <text x="32" y="21" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" font-weight="700" fill="#22d3ee" letter-spacing="1">YAPAY ZEKA &amp; YAZILIM</text>
      </g>

      <!-- Main Catchy Title -->
      <text y="90" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="52" font-weight="800" fill="url(#spTitleGrad)" letter-spacing="-1" line-height="1.2">
        Geleceğin Akıllı
      </text>
      <text y="155" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="52" font-weight="800" fill="url(#spTitleGrad)" letter-spacing="-1">
        Yazılım Sistemleri
      </text>

      <!-- Subtitle Description -->
      <text y="225" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="20" font-weight="400" fill="#94a3b8" width="500">
        Kurumsal mimariler, büyük veri çözümleri ve
      </text>
      <text y="258" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
        özelleştirilmiş Yapay Zeka RAG altyapıları.
      </text>

      <!-- 3 Feature Points with Icons -->
      <g transform="translate(0, 320)">
        <!-- Item 1 -->
        <g transform="translate(0, 0)">
          <rect width="240" height="110" rx="14" fill="rgba(14,22,38,0.7)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <circle cx="34" cy="36" r="16" fill="rgba(14,165,233,0.15)"/>
          <path d="M 28,36 L 33,41 L 41,31" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="75" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="15" font-weight="700" fill="#ffffff">Yapay Zeka (AI)</text>
          <text x="34" y="93" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" font-weight="500" fill="#64748b">LLM &amp; RAG Entegrasyonu</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(260, 0)">
          <rect width="240" height="110" rx="14" fill="rgba(14,22,38,0.7)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <circle cx="34" cy="36" r="16" fill="rgba(34,211,238,0.15)"/>
          <circle cx="34" cy="36" r="8" fill="none" stroke="#22d3ee" stroke-width="2"/>
          <text x="34" y="75" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="15" font-weight="700" fill="#ffffff">Özel Yazılım</text>
          <text x="34" y="93" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" font-weight="500" fill="#64748b">Ölçeklenebilir Mikroservis</text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(520, 0)">
          <rect width="240" height="110" rx="14" fill="rgba(14,22,38,0.7)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <circle cx="34" cy="36" r="16" fill="rgba(99,102,241,0.15)"/>
          <polygon points="34,26 42,42 26,42" fill="none" stroke="#818cf8" stroke-width="2"/>
          <text x="34" y="75" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="15" font-weight="700" fill="#ffffff">Bulut &amp; DevOps</text>
          <text x="34" y="93" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="12" font-weight="500" fill="#64748b">Yüksek Performans &amp; Güvenlik</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Bar: Contact & Web -->
  <g transform="translate(80, 930)">
    <!-- Website Link -->
    <g transform="translate(0, 20)">
      <circle cx="16" cy="16" r="14" fill="rgba(14,165,233,0.12)"/>
      <circle cx="16" cy="16" r="7" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="42" y="22" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="1">zersoft.net</text>
    </g>

    <!-- Social Handle -->
    <g transform="translate(740, 20)">
      <text x="180" y="22" text-anchor="end" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="16" font-weight="600" fill="#38bdf8">@zersofttech</text>
    </g>
  </g>
</svg>
