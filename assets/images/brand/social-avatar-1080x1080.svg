<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Zersoft Sosyal Medya Profil Avatarı">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="avBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="60%" stop-color="#070c15"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Stream Gradients -->
    <linearGradient id="avG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avG3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Square Base Background -->
  <rect width="1080" height="1080" fill="url(#avBg)"/>

  <!-- Ambient Glow in center -->
  <circle cx="540" cy="500" r="320" fill="#0ea5e9" opacity="0.15" filter="blur(90px)"/>

  <!-- Outer Safe Circle for Instagram / LinkedIn Avatar Crop -->
  <circle cx="540" cy="540" r="480" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.4"/>
  <circle cx="540" cy="540" r="470" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Centered Scaled Convergence Mark -->
  <g transform="translate(340, 290) scale(7.8)" filter="url(#avGlow)">
    <polygon points="0,5  3,11  44,33  44,31" fill="url(#avG1)"/>
    <polygon points="0,29  0,35  44,33  44,31" fill="url(#avG2)"/>
    <polygon points="0,53  3,59  44,33  44,31" fill="url(#avG3)"/>
    <circle cx="44" cy="32" r="3.8" fill="#0ea5e9"/>
    <circle cx="44" cy="32" r="1.6" fill="#ffffff"/>
  </g>

  <!-- Brand Typography below mark -->
  <g transform="translate(540, 770)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="64" font-weight="800" letter-spacing="6">
      <tspan fill="#f0f9ff">ZER</tspan><tspan fill="#38bdf8">SOFT</tspan>
    </text>
    <text y="42" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="19" font-weight="600" letter-spacing="3" fill="#94a3b8">
      YENİ NESİL TEKNOLOJİ
    </text>
  </g>
</svg>
