<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2480 3508" width="2480" height="3508" role="img" aria-label="Zersoft Kartvizit A4 Açık Minimalist ÖN YÜZ Baskı Dizilimi">
  <defs>
    <!-- Source Card Defs -->
    <linearGradient id="stream1W" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stream2W" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stream3W" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanLineW" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- Single Business Card Symbol (1050 × 600 px) -->
    <g id="card_white_front">
      <!-- Clean Premium White Background -->
  <rect width="1050" height="600" fill="#ffffff"/>
  
  <!-- Subtle gradient glow at bottom right -->
  <circle cx="950" cy="500" r="300" fill="#0ea5e9" opacity="0.04"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1002" height="552" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- NFC Contactless Icon -->
  <g transform="translate(940, 50)" opacity="0.3" stroke="#0ea5e9" stroke-width="2" fill="none">
    <path d="M 0,28 A 20,20 0 0,1 20,8"/>
    <path d="M 0,20 A 13,13 0 0,1 13,7"/>
    <path d="M 0,12 A 6,6 0 0,1 6,6"/>
  </g>

  <!-- Main Centered Brand Block -->
  <g transform="translate(235, 205)">
    <!-- Convergence Mark Large -->
    <g transform="translate(0, 5) scale(2.6)">
      <polygon points="0,5  3,11  44,33  44,31" fill="url(#stream1W)"/>
      <polygon points="0,29  0,35  44,33  44,31" fill="url(#stream2W)"/>
      <polygon points="0,53  3,59  44,33  44,31" fill="url(#stream3W)"/>
      <circle cx="44" cy="32" r="3.6" fill="#0ea5e9"/>
      <circle cx="44" cy="32" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(150, 20)">
      <text
        x="0" y="80"
        font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif"
        font-size="70" font-weight="800"
        letter-spacing="4"
        textLength="420"
        lengthAdjust="spacing"
      ><tspan fill="#0f172a">ZER</tspan><tspan fill="#0ea5e9">SOFT</tspan></text>

      <text
        x="0" y="122"
        font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif"
        font-size="20.5" font-weight="600"
        letter-spacing="2.2"
        textLength="420"
        lengthAdjust="spacing"
        fill="#64748b"
      >YENİ NESİL TEKNOLOJİ</text>
    </g>
  </g>

  <!-- Bottom Accent Ribbon / Web URL -->
  <g transform="translate(525, 520)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#0ea5e9">WWW.ZERSOFT.NET</text>
  </g>
    </g>
  </defs>

  <!-- Sheet Background -->
  <rect width="2480" height="3508" fill="#ffffff"/>

  <!-- Top Sheet Metadata Header -->
  <g transform="translate(1240.0, 147.0)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="42" font-weight="800" fill="#0284c7" letter-spacing="3">
      ZERSOFT TEKNOLOJİ &#8226; KARTVİZİT BASKI DİZİLİMİ (A4 / 300 DPI) &#8226; AÇIK MINIMALIST &#8226; ÖN YÜZ
    </text>
    <text y="48" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="26" font-weight="600" fill="#64748b" letter-spacing="1">
      Ebat: 85 × 55 mm &#8226; Adet: 10 Kart / Sayfa &#8226; Çift Yönlü Baskıda 1:1 Simetrik Çakışma Garantili
    </text>
  </g>

  <!-- Crop Marks (Kesim Kılavuzları) -->
  <g id="cropMarks">
    <line x1="190" y1="194" x2="190" y2="239" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="190" y1="3269" x2="190" y2="3314" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="1240" y1="194" x2="1240" y2="239" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="1240" y1="3269" x2="1240" y2="3314" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2290" y1="194" x2="2290" y2="239" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2290" y1="3269" x2="2290" y2="3314" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="130" y1="254" x2="175" y2="254" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2305" y1="254" x2="2350" y2="254" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="130" y1="854" x2="175" y2="854" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2305" y1="854" x2="2350" y2="854" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="130" y1="1454" x2="175" y2="1454" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2305" y1="1454" x2="2350" y2="1454" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="130" y1="2054" x2="175" y2="2054" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2305" y1="2054" x2="2350" y2="2054" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="130" y1="2654" x2="175" y2="2654" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2305" y1="2654" x2="2350" y2="2654" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="130" y1="3254" x2="175" y2="3254" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
    <line x1="2305" y1="3254" x2="2350" y2="3254" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
  </g>

  <!-- Cards Grid Layer -->
  <g id="cardsGrid">
    <use xlink:href="#card_white_front" href="#card_white_front" x="190" y="254" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="1240" y="254" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="190" y="854" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="1240" y="854" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="190" y="1454" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="1240" y="1454" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="190" y="2054" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="1240" y="2054" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="190" y="2654" />
    <use xlink:href="#card_white_front" href="#card_white_front" x="1240" y="2654" />
  </g>

  <!-- Bottom Registration & Info Bar -->
  <g transform="translate(1240.0, 3401.0)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="26" font-weight="600" fill="#64748b" letter-spacing="2">
      &#169; Zersoft Teknoloji &#8226; Ramazan Tuncer (+90 555 587 93 70) &#8226; Bursa, Türkiye &#8226; www.zersoft.net
    </text>
  </g>
</svg>
