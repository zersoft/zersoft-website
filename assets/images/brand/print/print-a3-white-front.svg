    <line x1="16.00" y1="182.50" x2="20.00" y2="182.50" stroke="#0f172a" stroke-width="0.2"/>
    <line x1="277.00" y1="182.50" x2="281.00" stroke="#0f172a" stroke-width="0.2"/>
    <line x1="16.00" y1="237.50" x2="20.00" y2="237.50" stroke="#0f172a" stroke-width="0.2"/>
    <line x1="277.00" y1="237.50" x2="281.00" stroke="#0f172a" stroke-width="0.2"/>
    <line x1="16.00" y1="292.50" x2="20.00" y2="292.50" stroke="#0f172a" stroke-width="0.2"/>
    <line x1="277.00" y1="292.50" x2="281.00" stroke="#0f172a" stroke-width="0.2"/>
    <line x1="16.00" y1="347.50" x2="20.00" y2="347.50" stroke="#0f172a" stroke-width="0.2"/>
    <line x1="277.00" y1="347.50" x2="281.00" stroke="#0f172a" stroke-width="0.2"/>
