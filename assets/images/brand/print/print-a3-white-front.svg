      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- Single Business Card Symbol (1050 × 600 px) -->
    <g id="card_white_front">
      <!-- Clean Premium White Background -->
  <rect width="1050" height="600" fill="#ffffff"/>
  
  <!-- Subtle gradient glow at bottom right -->
  <circle cx="950" cy="500" r="300" fill="#0ea5e9" opacity="0.04"/>

