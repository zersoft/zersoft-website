    <use href="#card_white_front" x="21.00" y="72.50" />
    <use href="#card_white_front" x="106.00" y="72.50" />
    <use href="#card_white_front" x="191.00" y="72.50" />
    <use href="#card_white_front" x="21.00" y="127.50" />
    <use href="#card_white_front" x="106.00" y="127.50" />
    <use href="#card_white_front" x="191.00" y="127.50" />
    <use href="#card_white_front" x="21.00" y="182.50" />
    <use href="#card_white_front" x="106.00" y="182.50" />
    <use href="#card_white_front" x="191.00" y="182.50" />
    <use href="#card_white_front" x="21.00" y="237.50" />
    <use href="#card_white_front" x="106.00" y="237.50" />
