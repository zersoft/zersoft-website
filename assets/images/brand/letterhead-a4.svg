      <polygon points="0,29  0,35  44,33  44,31" fill="#0284c7"/>
      <polygon points="0,53  3,59  44,33  44,31" fill="#4f46e5"/>
      <circle cx="44" cy="32" r="3.5" fill="#0284c7"/>
