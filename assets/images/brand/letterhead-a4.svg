      <text y="20" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" font-weight="500" fill="#64748b">Mersis: 0000000000000000 &#8226; V.D: İstanbul</text>
      <text y="38" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="11" font-weight="500" fill="#0284c7">info@zersoft.net &#8226; www.zersoft.net</text>
