        <tspan fill="#1e293b">ZER</tspan><tspan fill="#0284c7">SOFT</tspan>
      </text>
      <text x="0" y="59" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#64748b">
