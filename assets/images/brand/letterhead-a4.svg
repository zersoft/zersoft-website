  <!-- Document Body Placeholder Guidelines -->
  <g transform="translate(100, 260)">
    <text font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Tarih: 18.08.2026</text>
    <text y="30" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Sayı: ZS-2026/08-01</text>
    <text y="70" font-family="'Plus Jakarta Sans','Inter',sans-serif" font-size="16" font-weight="700" fill="#1e293b">İLGİLİ MAKAMA,</text>
    
    <!-- Sample text line sketches -->
    <rect x="0" y="110" width="1040" height="12" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="135" width="980" height="12" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="160" width="1020" height="12" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="185" width="850" height="12" rx="4" fill="#f1f5f9"/>

    <rect x="0" y="235" width="1040" height="12" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="260" width="1000" height="12" rx="4" fill="#f1f5f9"/>
    <rect x="0" y="285" width="700" height="12" rx="4" fill="#f1f5f9"/>
  </g>

