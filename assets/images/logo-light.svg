<!--
  ZERSOFT — Abstract Mark V: "Convergence" (Light Mode - Koyu Gri / Charcoal Typography)
  
  Light Background Colors:
  - ZER: Koyu Antrasit Gri (#1e293b) - Yumuşak, modern ve göz yormayan derinlik
  - SOFT: Canlı Okyanus Mavisi (#0284c7)
  - Tagline: Slate Gri (#64748b)
  - Streams: Saturated cyan, royal blue, and indigo
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Zersoft — Yeni Nesil Teknoloji">
  <defs>
    <style>
      .cvl-zer  { fill: #1e293b; }
      .cvl-soft { fill: #0284c7; }
      .cvl-tag  { fill: #64748b; }
    </style>

    <linearGradient id="cvlG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="75%"  stop-color="#0891b2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cvlG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="75%"  stop-color="#0369a1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cvlG3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="75%"  stop-color="#4f46e5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Mark: Three streams converging to a focal point ── -->
  <g transform="translate(3, 0)">
    <!-- Stream 1: top → focal point -->
    <polygon points="0,5  3,11  44,33  44,31" fill="url(#cvlG1)"/>

    <!-- Stream 2: middle → focal point (thickest) -->
    <polygon points="0,29  0,35  44,33  44,31" fill="url(#cvlG2)"/>

    <!-- Stream 3: bottom → focal point -->
    <polygon points="0,53  3,59  44,33  44,31" fill="url(#cvlG3)"/>

    <!-- Focal accent: the convergence point -->
    <circle cx="44" cy="32" r="3.5" fill="#0284c7"/>
    <circle cx="44" cy="32" r="1.3" fill="#ffffff"/>
  </g>

  <!-- ── Wordmark ───────────────────────────────────────────────────── -->
  <g transform="translate(64, 0)">
    <text
      x="0" y="41"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="32" font-weight="800"
      letter-spacing="2"
      textLength="176"
      lengthAdjust="spacing"
    ><tspan class="cvl-zer">ZER</tspan><tspan class="cvl-soft">SOFT</tspan></text>

    <text
      x="0" y="58"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="9.5" font-weight="600"
      letter-spacing="0.8"
      textLength="176"
      lengthAdjust="spacing"
      class="cvl-tag"
    >YENİ NESİL TEKNOLOJİ</text>
  </g>
</svg>
