<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Shield Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#logoGrad)" filter="url(#glow)" />
    <!-- Branch/Nodes Icon inside logo -->
    <path d="M 25 48 C 25 35, 45 35, 45 22 M 45 48 C 45 35, 25 35, 25 22 M 35 22 L 35 48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <circle cx="25" cy="22" r="4.5" fill="#ffffff" />
    <circle cx="45" cy="22" r="4.5" fill="#ffffff" />
    <circle cx="35" cy="48" r="5.5" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <text x="95" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="1">ZER<tspan fill="url(#logoGrad)">SOFT</tspan></text>
  <text x="96" y="78" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="3.5">TECHNOLOGY</text>
</svg>
