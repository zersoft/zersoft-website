<!--
  ZERSOFT — Abstract Mark I: "Origin"
  Konsept: ZER = sıfır = her şeyin başladığı nokta.
  Koordinat sisteminin orijin noktasından dışa doğru yayılan enerji halkalar
  ve iki çok ince eksen çizgisi. Evrensel, soyut, derin anlamlı.
  
  Referans hissiyat: Figma, Notion, Linear — ama tamamen özgün.
  Mesaj: "Dijital dönüşümünüzün başlangıç noktasıyız."
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Zersoft — Yeni Nesil Teknoloji">
  <defs>
    <style>
      .ori-axis   { stroke: #0ea5e9; stroke-opacity: 0.3; }
      .ori-ring1  { stroke: #0ea5e9; stroke-opacity: 0.18; fill: none; }
      .ori-ring2  { stroke: #0ea5e9; stroke-opacity: 0.32; fill: none; }
      .ori-ring3  { stroke: #0ea5e9; stroke-opacity: 0.55; fill: none; }
      .ori-core   { fill: url(#oriCoreGrad); }
      .ori-zer    { fill: #0c1b30; }
      .ori-soft   { fill: #0ea5e9; }
      .ori-tag    { fill: #94a3b8; }
      @media (prefers-color-scheme: dark) {
        .ori-axis  { stroke: #38bdf8; stroke-opacity: 0.2; }
        .ori-ring1 { stroke: #38bdf8; stroke-opacity: 0.12; }
        .ori-ring2 { stroke: #38bdf8; stroke-opacity: 0.25; }
        .ori-ring3 { stroke: #38bdf8; stroke-opacity: 0.45; }
        .ori-zer   { fill: #f0f9ff; }
        .ori-soft  { fill: #38bdf8; }
        .ori-tag   { fill: #475569; }
      }
    </style>
    <linearGradient id="oriCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Clip to keep rings inside the mark area -->
    <clipPath id="oriClip">
      <rect x="0" y="0" width="56" height="64"/>
    </clipPath>
  </defs>

  <!-- ── Mark: Origin Point + Rings (center at 28, 32) ─ -->
  <g clip-path="url(#oriClip)">
    <!-- Cross axes (very thin, very subtle) -->
    <line x1="28" y1="0"  x2="28" y2="64" class="ori-axis" stroke-width="1" stroke-dasharray="2,5"/>
    <line x1="0"  y1="32" x2="56" y2="32" class="ori-axis" stroke-width="1" stroke-dasharray="2,5"/>

    <!-- Expanding rings — concentric, opacity decreases outward -->
    <circle cx="28" cy="32" r="22" class="ori-ring1" stroke-width="1"/>
    <circle cx="28" cy="32" r="14" class="ori-ring2" stroke-width="1.25"/>
    <circle cx="28" cy="32" r="7"  class="ori-ring3" stroke-width="1.5"/>

    <!-- Core dot — solid, gradient, the "zero point" -->
    <circle cx="28" cy="32" r="4.5" class="ori-core"/>
  </g>

  <!-- ── Wordmark ─────────────────────────────────────── -->
  <g transform="translate(64, 0)">
    <text x="0" y="41"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,sans-serif"
      font-size="32" font-weight="800" letter-spacing="-0.5">
      <tspan class="ori-zer">ZER</tspan><tspan class="ori-soft">SOFT</tspan>
    </text>
    <text x="2" y="58"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,sans-serif"
      font-size="9.5" font-weight="500" letter-spacing="3.5" class="ori-tag">
      YENİ NESİL TEKNOLOJİ
    </text>
  </g>
</svg>
