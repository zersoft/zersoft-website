<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Zersoft">
  <defs>
    <linearGradient id="favG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="favG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="favG3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Centered Convergence Mark filling the entire favicon square -->
  <g>
    <!-- Stream 1 (top): cyan -->
    <polygon points="40,45  90,100  430,268  430,244" fill="url(#favG1)"/>

    <!-- Stream 2 (middle): azure blue -->
    <polygon points="40,220 40,292  430,268  430,244" fill="url(#favG2)"/>

    <!-- Stream 3 (bottom): indigo purple -->
    <polygon points="40,467 90,412  430,268  430,244" fill="url(#favG3)"/>

    <!-- Focal point dot -->
    <circle cx="430" cy="256" r="75" fill="#0284c7"/>
    <circle cx="430" cy="256" r="32" fill="#ffffff"/>
  </g>
</svg>
