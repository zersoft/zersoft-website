<!--
  ZERSOFT — Abstract Mark V: "Convergence"
  
  Konsept: Prism Split'in tersine çevrilmiş ve özgünleştirilmiş versiyonu.
  Klasik prism: 1 girdi → birçok çıktı (çok kullanılmış, Pink Floyd klişesi)
  Bu mark:     N girdi → 1 keskin odak noktası
  
  Anlam: ZERSOFT, sahadan gelen karmaşık veri akışlarını (kantar sinyalleri,
  süreci verileri, AI çıktıları) tek bir keskin, güvenilir karara dönüştürür.
  
  Geometri: Üç paralel çizgi solda serbest akar, sağa doğru daralan açıyla
  tek bir keskin noktada birleşir. Hiçbir açık kaynak logo veritabanında 
  bu spesifik formda bir tech logosu yoktur.
  
  Ayrıca: Yandan bakınca bir tür ">" (büyüktür) işareti okunabilir —
  "ileri", "daha fazla", "sonraki" metaforu gizli.
  
  İnce optik detay: Çizgiler eşit aralıklı değil — orta çizgi biraz daha
  kalın ve biraz daha az daralan, gözün doğal olarak odağa çekilmesini sağlar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Zersoft — Yeni Nesil Teknoloji">
  <defs>
    <style>
      .cv-zer  { fill: #0c1b30; }
      .cv-soft { fill: #0ea5e9; }
      .cv-tag  { fill: #94a3b8; }
      @media (prefers-color-scheme: dark) {
        .cv-zer  { fill: #f0f9ff; }
        .cv-soft { fill: #38bdf8; }
        .cv-tag  { fill: #475569; }
      }
    </style>

    <!--
      Çizgi 1 (üst): Açık siyan — en fazla yol kat ediyor, en dramatik açı
      Çizgi 2 (orta): Tam marka rengi — göz buraya kilitlenir
      Çizgi 3 (alt): Derin mavi — derinlik ve ağırlık hissi
    -->
    <linearGradient id="cvG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="75%"  stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cvG2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0ea5e9" stop-opacity="0.55"/>
      <stop offset="75%"  stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cvG3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="75%"  stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Mark: Three streams converging to a focal point ── -->
  <!--
    Focal point: (44, 32) — sağ tarafta, ortada
    
    Stream 1 (top):   başlar (0, 8)  → converges → (44, 32)
    Stream 2 (mid):   başlar (0, 32) → straight  → (44, 32)  [yatay, en kısa yol]
    Stream 3 (bottom):başlar (0, 56) → converges → (44, 32)

    Her stream çizgi değil, ince bant (trapezoid) olarak çiziliyor:
    Solda ~3-4px yükseklikte başlar, sağa doğru sıfırlanır.
    Bu sayede sol taraf dolu/geniş, sağ taraf keskin/odaklı görünür.
    
    Optik hassasiyet:
    - Stream 2 (middle) 2px yerine 2.5px — hafif dominant
    - Streamler arası boşluklar eşit değil, hafif golden ratio'ya yakın
  -->
  <g transform="translate(3, 0)">
    <!-- Stream 1: top → focal point -->
    <polygon points="0,5  3,11  44,33  44,31" fill="url(#cvG1)"/>

    <!-- Stream 2: middle → focal point (thickest) -->
    <polygon points="0,29  0,35  44,33  44,31" fill="url(#cvG2)"/>

    <!-- Stream 3: bottom → focal point -->
    <polygon points="0,53  3,59  44,33  44,31" fill="url(#cvG3)"/>

    <!-- Focal accent: the convergence point — gradient dot -->
    <circle cx="44" cy="32" r="3.2" fill="#0ea5e9"/>
    <!-- Inner white core: crisp, high-contrast -->
    <circle cx="44" cy="32" r="1.3" fill="#ffffff"/>
  </g>

  <!-- ── Wordmark ─────────────────────────────────────────────────────
    Tipografi hizalama:
    - ZERSOFT: letter-spacing artırıldı (2px) + textLength="176" spacing modunda
      → harfler yayıldı, glif oranları korundu
    - Tagline: letter-spacing azaltıldı (0.8px) + aynı textLength="176"
      → tagline daraltıldı, her iki satır aynı görsel genişliğe kavuştu
    - Tagline x="0" (ZERSOFT ile aynı sol kenar) — optik hizalama tamam
  ──────────────────────────────────────────────────────────────────── -->
  <g transform="translate(64, 0)">
    <text
      x="0" y="41"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="32" font-weight="800"
      letter-spacing="2"
      textLength="176"
      lengthAdjust="spacing"
    ><tspan class="cv-zer">ZER</tspan><tspan class="cv-soft">SOFT</tspan></text>

    <text
      x="0" y="58"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="9.5" font-weight="500"
      letter-spacing="0.8"
      textLength="176"
      lengthAdjust="spacing"
      class="cv-tag"
    >YENİ NESİL TEKNOLOJİ</text>
  </g>
</svg>
