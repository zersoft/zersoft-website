<!--
  ZERSOFT — Prism Split REFINED (Mark IV-B)
  
  Orijinal Prism'in sorunları:
  1. Giriş ışın çizgisi (input beam) klişeyi doğrudan aktarıyor
  2. Üçgen formu Pink Floyd referansını çağrıştırıyor
  3. Bandlar çok ince ve soluk
  
  Bu versiyonda:
  - Üçgen/prism formu kaldırıldı — yerine soyut bir "kırılım noktası"
  - Giriş çizgisi yok — odak noktasından başlıyoruz
  - 3 band daha kalın ve güçlü — daha iyi görünürlük küçük boyutlarda
  - Monochromatic palette korundu (siyan → indigo) — mark olarak sahip çıkılabilir
  - Focal point: küçük, keskin — marka ikonunun merkezinde okunur
  
  Sonuç: Prism'in hikayesini korur, formunu terk eder.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="Zersoft — Yeni Nesil Teknoloji">
  <defs>
    <style>
      .ps2-zer  { fill: #0c1b30; }
      .ps2-soft { fill: #0ea5e9; }
      .ps2-tag  { fill: #94a3b8; }
      @media (prefers-color-scheme: dark) {
        .ps2-zer  { fill: #f0f9ff; }
        .ps2-soft { fill: #38bdf8; }
        .ps2-tag  { fill: #475569; }
      }
    </style>

    <!-- Band gradients: vivid at origin → transparent at tip -->
    <linearGradient id="ps2G1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ps2G2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ps2G3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!--
    Origin point: (10, 32) — left side, vertically centered
    Bands fan RIGHT from this point (not from a triangle/prism shape):
    
    Band 1 (top):   (10,32) → tip at (52, 12) — top-right
    Band 2 (mid):   (10,32) → tip at (52, 30) — slightly above center
    Band 3 (bot):   (10,32) → tip at (52, 52) — bottom-right
    
    Each band is ~5-6px wide at origin, tapering to near-zero.
    
    Key: bands DO NOT start from the very same point (that would be a star burst).
    They start from a narrow 3px vertical range at x=10, simulating that
    the origin emits them but they are already slightly separated.
  -->
  <g transform="translate(3, 0)">
    <!-- Band 1: top ray -->
    <polygon points="10,30  10,34  52,14  52,10" fill="url(#ps2G1)"/>

    <!-- Band 2: middle ray -->
    <polygon points="10,30  10,34  52,33  52,29" fill="url(#ps2G2)"/>

    <!-- Band 3: bottom ray -->
    <polygon points="10,30  10,34  52,54  52,50" fill="url(#ps2G3)"/>

    <!-- Origin focal point -->
    <circle cx="10" cy="32" r="3.5" fill="#0ea5e9"/>
    <circle cx="10" cy="32" r="1.4" fill="#ffffff"/>
  </g>

  <!-- ── Wordmark ─────────────────────────────────────────────── -->
  <g transform="translate(72, 0)">
    <text
      x="0" y="41"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="32" font-weight="800"
      letter-spacing="2"
      textLength="168"
      lengthAdjust="spacing"
    ><tspan class="ps2-zer">ZER</tspan><tspan class="ps2-soft">SOFT</tspan></text>

    <text
      x="0" y="58"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="9.5" font-weight="500"
      letter-spacing="0.8"
      textLength="168"
      lengthAdjust="spacing"
      class="ps2-tag"
    >YENİ NESİL TEKNOLOJİ</text>
  </g>
</svg>
