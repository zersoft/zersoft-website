  <text x="45" y="111" fill="#00f2fe" font-family="sans-serif" font-weight="700" font-size="12">📊 Canlı Tartım</text>
  <text x="45" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12">🚛 Saha Plakaları</text>
  <text x="45" y="195" fill="#94a3b8" font-family="sans-serif" font-size="12">📑 İrsaliye Listesi</text>
  <text x="45" y="235" fill="#94a3b8" font-family="sans-serif" font-size="12">🏢 Cari Hesaplar</text>
  <text x="45" y="275" fill="#94a3b8" font-family="sans-serif" font-size="12">📷 Kamera Entegrasyonu</text>
  <text x="45" y="315" fill="#94a3b8" font-family="sans-serif" font-size="12">⚙️ Otomasyon Ayarları</text>

  <!-- Live Scale Panel -->
  <rect x="210" y="65" width="380" height="220" rx="12" fill="#121a2d" stroke="rgba(0,242,254,0.2)"/>
  <text x="230" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">CANLI KANTAR TARTIM İNDİKATÖRÜ</text>
  <rect x="230" y="110" width="340" height="90" rx="8" fill="#090d16" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="250" y="172" fill="#00f2fe" font-family="monospace" font-weight="900" font-size="44" letter-spacing="2">38.450 KG</text>
  <rect x="230" y="215" width="100" height="28" rx="6" fill="#10b981"/>
  <text x="245" y="233" fill="#fff" font-family="sans-serif" font-weight="700" font-size="11">✓ DARI SABİT</text>
  <rect x="340" y="215" width="120" height="28" rx="6" fill="#3b82f6"/>
  <text x="352" y="233" fill="#fff" font-family="sans-serif" font-weight="700" font-size="11">BARİYER AÇIK</text>

