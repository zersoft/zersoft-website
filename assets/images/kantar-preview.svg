<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dashboard Container -->
  <rect x="0" y="0" width="900" height="550" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="900" height="50" rx="16" fill="#121a2d"/>
  <rect x="0" y="48" width="900" height="2" fill="url(#accentGrad)"/>
  <circle cx="25" cy="25" r="6" fill="#ef4444"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="30" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="14">Zersoft Kantar Otomasyonu v4.2 — Canlı Saha İzleme &amp; Plaka Tanıma</text>

  <!-- Sidebar -->
  <rect x="15" y="65" width="180" height="470" rx="10" fill="#0d1322" stroke="rgba(255,255,255,0.05)"/>
