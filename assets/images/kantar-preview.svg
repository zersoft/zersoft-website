  <rect x="605" y="65" width="280" height="220" rx="12" fill="#121a2d" stroke="rgba(255,255,255,0.08)"/>
  <text x="625" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">AI PLAKA TANIMA KAMERASI (CAM-01)</text>
  <rect x="625" y="110" width="240" height="120" rx="8" fill="#000"/>
  <!-- Truck Icon in Camera -->
  <path d="M 680 180 L 730 180 L 750 160 L 780 160 L 780 190 L 680 190 Z" fill="#334155"/>
  <circle cx="700" cy="195" r="10" fill="#64748b"/>
  <circle cx="760" cy="195" r="10" fill="#64748b"/>
  <!-- License Plate Box -->
  <rect x="670" y="130" width="150" height="36" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="672" y="132" width="22" height="32" fill="#003399"/>
  <text x="676" y="152" fill="#fff" font-family="sans-serif" font-weight="900" font-size="10">TR</text>
  <text x="702" y="156" fill="#000" font-family="monospace" font-weight="900" font-size="18">16 ZER 34</text>

  <!-- Data Table -->
  <rect x="210" y="300" width="675" height="235" rx="12" fill="#121a2d" stroke="rgba(255,255,255,0.08)"/>
  <text x="230" y="330" fill="#fff" font-family="sans-serif" font-weight="700" font-size="14">Son Saha Tartım İşlemleri</text>

