  <text x="245" y="365" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">FİŞ NO</text>
  <text x="325" y="365" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">PLAKA</text>
  <text x="430" y="365" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">FİRMA / CARİ</text>
  <text x="590" y="365" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">NET (KG)</text>
  <text x="690" y="365" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">TARİH / SAAT</text>
  <text x="795" y="365" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700">DURUM</text>

  <!-- Rows -->
  <text x="245" y="400" fill="#fff" font-family="sans-serif" font-size="12">#10842</text>
  <text x="325" y="400" fill="#00f2fe" font-family="monospace" font-weight="700" font-size="12">16 ZER 34</text>
  <text x="430" y="400" fill="#cbd5e1" font-family="sans-serif" font-size="12">Zersoft İnşaat A.Ş.</text>
  <text x="590" y="400" fill="#10b981" font-family="monospace" font-weight="700" font-size="12">24.150</text>
  <text x="690" y="400" fill="#94a3b8" font-family="sans-serif" font-size="12">14.08.2026 14:32</text>
  <text x="795" y="400" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="11">✓ Onaylandı</text>

  <line x1="230" y1="415" x2="865" y2="415" stroke="rgba(255,255,255,0.05)"/>

  <text x="245" y="440" fill="#fff" font-family="sans-serif" font-size="12">#10841</text>
  <text x="325" y="440" fill="#00f2fe" font-family="monospace" font-weight="700" font-size="12">34 KTR 99</text>
  <text x="430" y="440" fill="#cbd5e1" font-family="sans-serif" font-size="12">Demirkan Hafriyat Ltd.</text>
  <text x="590" y="440" fill="#10b981" font-family="monospace" font-weight="700" font-size="12">18.620</text>
  <text x="690" y="440" fill="#94a3b8" font-family="sans-serif" font-size="12">14.08.2026 14:20</text>
  <text x="795" y="440" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="11">✓ Onaylandı</text>

  <line x1="230" y1="455" x2="865" y2="455" stroke="rgba(255,255,255,0.05)"/>

  <text x="245" y="480" fill="#fff" font-family="sans-serif" font-size="12">#10840</text>
  <text x="325" y="480" fill="#00f2fe" font-family="monospace" font-weight="700" font-size="12">16 MOK 55</text>
  <text x="430" y="480" fill="#cbd5e1" font-family="sans-serif" font-size="12">Maden Madencilik San.</text>
  <text x="590" y="480" fill="#10b981" font-family="monospace" font-weight="700" font-size="12">31.400</text>
  <text x="690" y="480" fill="#94a3b8" font-family="sans-serif" font-size="12">14.08.2026 14:05</text>
  <text x="795" y="480" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="11">✓ Onaylandı</text>
